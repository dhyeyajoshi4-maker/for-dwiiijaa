<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>For you, Dwiiijaaa 🌷</title><link rel="stylesheet" href="style.css"></head><body>
<div id="app">
<section id="opening" class="scene active"><video id="flowerVideo" class="flower-video" src="assets/flowers.mp4" muted playsinline preload="auto"></video><div class="opening-shade"></div><div class="opening-title">for you, Dwiiijaaa</div></section>
<section id="setup" class="scene"><div class="setup-card"><div class="tiny">a little surprise for you ♡</div><h1>Choose the photos</h1><p>Select the photos you want in the edit. They stay on this device/browser; they are not uploaded anywhere.</p><label class="upload"><input id="photos" type="file" accept="image/*" multiple><span>＋ Choose photos</span></label><div id="previews" class="previews"></div><label class="upload audio"><input id="music" type="file" accept="audio/*"><span>♪ Add your Made in Japan audio (optional)</span></label><button id="start" disabled>start the edit ♡</button></div></section>
<section id="edit" class="scene"><div class="grain"></div><div id="slide" class="slide"></div><div class="progress"><i></i></div><button id="sound" class="sound">♪</button></section>
<section id="ending" class="scene"><video id="endFlower" class="flower-video" src="assets/flowers.mp4" muted playsinline preload="auto"></video><div class="opening-shade"></div><div class="ending-title">made just for you, Dwiiijaaa ♡</div><button id="again">again 🌷</button></section>
</div><script src="script.js"></script></body></html>
